# ── 场景推演 9136 / 阶段一（隔离副本 9137）────────────────────────────
# @local/dsh-scene9136：status / plan / check / apply 四工具。
# 路径一律来自配置，插件内无绝对路径默认值；inkosRoot / libraryRoot 缺失会报 E_CONFIG_MISSING。
- insert:
    - id: scene9136
      name: '@local/dsh-scene9136'
      config:
        baseUrl: 'http://127.0.0.1:9137'
        timeoutMs: 5000
        inkosRoot: '<WS>\_WriterX升级-阶段0.5-20261109\_iso\scene9136\_isobooks'
        libraryRoot: 'F:\<USER>\Documents\WriterX\作品'
        stateFile: '<WX_HOME>\dsh-home\scene9136\state.json'
        keepBackup: 10

